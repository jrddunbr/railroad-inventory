{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
  <div class="box">
    <h1 class="title is-3">Change Password</h1>
    <p class="subtitle is-6">This page is always available to the signed-in user, even when effective access is read-only.</p>
    <form method="post" action="{{ url_for('main.account_password') }}" data-confirm-skip="true">
      <div class="field">
        <label class="label" for="current_password">Current Password</label>
        <div class="control">
          <input class="input" id="current_password" type="password" name="current_password" autocomplete="current-password" required />
        </div>
      </div>
      <div class="field">
        <label class="label" for="new_password">New Password</label>
        <div class="control">
          <input class="input" id="new_password" type="password" name="new_password" autocomplete="new-password" required />
        </div>
        <p class="keyboard-hint">Minimum 12 characters.</p>
      </div>
      <div class="field">
        <label class="label" for="confirm_password">Confirm New Password</label>
        <div class="control">
          <input class="input" id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" required />
        </div>
      </div>
      <div class="actions buttons">
        <button type="submit" class="button is-primary">Update Password</button>
        <a class="button is-light" href="{{ url_for('main.account_security') }}">Back to Account Security</a>
      </div>
    </form>
  </div>
{% endblock %}
